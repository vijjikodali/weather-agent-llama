name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENV: ci

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ======================
      # PYTHON SETUP (MISSING PIECE)
      # ======================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit requests

      # ======================
      # NODE + PLAYWRIGHT
      # ======================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ======================
      - name: Start Streamlit app
  run: |
    nohup python -m streamlit run app.py \
    --server.address 0.0.0.0 \
    --server.port 8501 \
    --server.headless true > app.log 2>&1 & --server.headless true > app.log 2>&1 &

      # ======================
      # WAIT FOR APP
      # ======================
   - name: Wait for app
  run: |
    for i in {1..60}; do
      curl -s http://localhost:8501 | grep "streamlit" && echo "READY" && exit 0
      sleep 2
    done
    echo "FAILED"
    cat app.log
    exit 1

      # ======================
      # RUN TESTS
      # ======================
      - name: Run tests
        run: npx playwright test

      # ======================
      # ARTIFACTS
      # ======================
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log